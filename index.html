    <script>
      const theme = localStorage.getItem("theme");

      if (theme) {
        document.documentElement.setAttribute("data-theme", theme);
      } else {
        const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      }
    </script>
